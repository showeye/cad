[project]
name = "cad"
version = "0.1.0"
description = "Parametric commercial CAD workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cadkit",
    "build123d>=0.13.0",
    "ocp-vscode>=4.2.0",
    "pyvista>=0.49.2",
    "trimesh>=5.2.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "projects/carnall",
    "projects/chess_set_clockwork",
    "projects/fala",
    "projects/serce",
]

[tool.uv.sources]
cadkit = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11", "networkx>=3.4", "lxml>=5.3"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
# every project has tests/test_model.py: import test files by path, not by bare module name
addopts = ["--import-mode=importlib"]
testpaths = [
    "packages/cadkit/tests",
    "projects/carnall/tests",
    "projects/chess_set_clockwork/tests",
    "projects/fala/tests",
    "projects/serce/tests",
]
